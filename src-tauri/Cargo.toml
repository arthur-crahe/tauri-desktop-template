[package]
name = "tauri-desktop-template"
version = "0.1.0"
description = "Reusable Tauri 2 + React + TypeScript desktop app skeleton"
edition = "2021"
# Toolchain: latest stable Rust — see ../rust-toolchain.toml.

[lib]
# `name` must match the `app_lib::run()` call in src/main.rs.
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# In-app updater (Tauri updater plugin) — desktop only, kept off mobile targets.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
